name: Something is broken
description: A screen, flow or control that does the wrong thing
labels: ["type: bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time. You don't need to know why it's broken — a
        clear description of what you saw is genuinely the useful part.

        **If this is a security or privacy problem** (you could see someone
        else's information, or get somewhere you shouldn't), close this and
        report it privately instead — see SECURITY.md.

  - type: dropdown
    id: app
    attributes:
      label: Which app?
      description: There are three, and they look similar on purpose.
      options:
        - Participant app (the one burners use)
        - Organiser console (org staff)
        - Supplier portal
        - Not sure
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you did, and what the app did back.
      placeholder: |
        I was on my camp's registration, filled in the Leave No Trace section
        and pressed Save. It said "Saved" but when I came back the section was
        empty again.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect instead?
      description: One line is fine. It's often the bit that reveals we disagree about what "correct" is.
    validations:
      required: true

  - type: dropdown
    id: where
    attributes:
      label: Where did you see it?
      options:
        - Running it locally
        - A pull request preview
        - The live site
    validations:
      required: true

  - type: input
    id: address
    attributes:
      label: What was the page address?
      description: |
        The bit after the domain is plenty, and **stop at the `?`**. Some of our
        links carry a sign-in or password-reset token in that query string, and
        this repository is public — pasting one here hands your account to
        whoever reads it first. `/auth/reset-password` tells us everything
        `/auth/reset-password?token=…` would.

        Worth the ten seconds otherwise: the screen you were on and the screen
        that actually broke are often not the same one.
      placeholder: /camps/dusty-boots/registration
    validations:
      required: false

  - type: textarea
    id: extras
    attributes:
      label: Screenshot, or anything else
      description: |
        Screenshots are welcome and usually enough.

        **Please blank out anyone's personal details** before uploading.
    validations:
      required: false

  - type: textarea
    id: console
    attributes:
      label: Browser console error
      description: |
        Only if you already know how to get one — skip this without a second
        thought if you don't. Paste it raw; it gets formatted for you.

        **Take out anything that looks like a key**: a long random string, a
        `token=` or `session=`, an `Authorization:` header. Nothing here is
        filtered before it goes public — unlike a report filed from inside the
        app, this form publishes exactly what you paste.
      render: text
    validations:
      required: false

  - type: checkboxes
    id: personal-data
    attributes:
      label: Before you post
      description: |
        This repository is public, and anyone can read it. A bug on this product
        is usually reported from a screen with other people's phone numbers,
        emergency contacts or medical notes on it — and the links that bring you
        here sometimes carry a token that is as good as your password.
      options:
        - label: I've checked that nothing above shows somebody else's personal details
          required: true
        - label: I've checked that nothing above contains a token, key or password — including inside a link
          required: true
