name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# One run per branch. Pushing again cancels the superseded run instead of
# leaving two full e2e fleets racing each other for runners — which is what
# happened while this file was being iterated on.
# LEAST PRIVILEGE. Without this block every job inherits the repository's
# default GITHUB_TOKEN scope, which on many repos is read/write across issues,
# packages, deployments and the contents themselves. Nothing in this workflow
# writes anything back — it lints, typechecks, builds and runs browsers — so it
# gets read access and nothing else. A compromised dependency in a build step
# then has no token worth stealing.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Conventional Commits with a workspace scope (CONTRIBUTING.md,
  # commitlint.config.mjs). BOTH halves are checked, because this repo MERGES
  # pull requests rather than squashing them: every individual commit lands on
  # `main`, so linting only the PR title would let unconventional history
  # through, and linting only the commits would leave the PR list — the thing
  # people actually read — unchecked.
  #
  # The local `commit-msg` hook covers the same ground, but a hook only binds a
  # machine that has run `pnpm install`, and `--no-verify` skips it. This does
  # not.
  commitlint:
    name: commit conventions
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      # `fetch-depth: 0` — the range check below needs the merge base, and the
      # default shallow clone does not have it.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.0

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      # The PR title. It is what the reviewer list shows and what a reader scans;
      # it is also the subject GitHub offers if this is ever squashed.
      - name: Lint the pull-request title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s' "$PR_TITLE" | pnpm exec commitlint

      # Every commit the PR adds. `--from`/`--to` over the merge base, so
      # anything already on main is out of scope — this enforces new history
      # without demanding the old history be rewritten.
      - name: Lint the commits in this pull request
        run: |
          pnpm exec commitlint \
            --from "${{ github.event.pull_request.base.sha }}" \
            --to "${{ github.event.pull_request.head.sha }}" \
            --verbose

  ci:
    name: lint · typecheck · test · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.0

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # No committed lockfile on the first CI run — allow pnpm to resolve and
      # write one. Switch this to `--frozen-lockfile` once pnpm-lock.yaml is
      # committed (which pins the resolution the gate below verifies).
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: CI gate
        run: pnpm turbo run lint typecheck test build

  # THE E2E SUITE, WHICH USED TO GATE NOTHING.
  #
  # 58 spec files and 232 tests existed, and CI ran `lint typecheck test build`
  # — none of which starts a browser. So every persona journey, every refusal
  # that protects the permission model, and the whole invite round trip could
  # break on main and CI would stay green. The suite was only ever run by hand,
  # on one laptop, against one Playwright project.
  #
  # A separate job so the fast gate above stays fast: this one has to stand up
  # Postgres plus the two Neon proxies (the serverless driver speaks
  # SQL-over-HTTP and WebSocket, and no single proxy does both — see
  # docker-compose.local.yml), migrate, seed, and boot three apps.
  #
  # It reuses scripts/e2e-local.sh rather than reimplementing it, so the thing
  # CI runs and the thing a developer runs cannot drift apart.
  e2e:
    name: e2e · ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # Don't cancel the others when one fails — a partial picture of what broke
      # is far less useful than the whole one, and this suite is the only thing
      # that exercises the product end to end.
      fail-fast: false
      # SPLIT BY PERSONA, NOT BY `--shard=n/8`. A mechanical slice cannot be
      # named: "shard 2 of 8 failed" tells you nothing about what broke, and you
      # have to open the log to learn even which app was involved. The persona
      # directories already ARE the split, they are well balanced (6-27 tests),
      # and the job name then says what the failure means.
      #
      # `side` marks which app each persona exercises. org-staff and god are the
      # console — the surface where a mistake exposes personal information,
      # destroys a supplier or approves the wrong thing — so they are the two
      # worth reading first when the board goes red.
      matrix:
        include:
          - persona: anon
            label: "anon · signed-out surfaces + privacy"
            side: web
          - persona: new-burner
            label: "new burner · sign-up, bio, the blocking gate"
            side: web
          - persona: camp-member
            label: "camp member · a member of someone else's camp"
            side: web
          - persona: camp-lead
            label: "camp lead · camp lifecycle, invites, registration"
            side: web
          - persona: officer
            label: "officer · assignment consent + phone disclosure"
            side: web
          - persona: org-staff
            label: "ORG staff · review queue, department scoping"
            side: org
          - persona: god
            label: "ORG system manager · anti-lockout, escalation refusals"
            side: org
          - persona: supplier
            label: "supplier · onboarding, documents, standing"
            side: suppliers
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.0

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm --filter @quagga/e2e exec playwright install --with-deps chromium

      - name: Run the persona suite
        # E2E_RESET_DB=1 so the run starts from a known-empty database. The
        # 27 Jul audit found the local suite running against 179 users of
        # accumulated state, which made four failures look like product bugs
        # when they were pagination timeouts against junk data.
        env:
          E2E_RESET_DB: "1"
          # TWO workers. A runner has 4 cores and is ALSO hosting three Next
          # servers, Postgres and two proxies, so this is a judgement about a
          # real ceiling — but it is only a judgement. It has NOT been re-tested
          # since the actual cause of the timeouts was found and fixed, and the
          # claim that once stood here ("four workers starve everything, the
          # previous run proved it") was never true: every timed-out URL in that
          # fleet was `/camps/[slug]` or its `settings/roles` child and nothing
          # else, which is not what a starved runner looks like. It was the dev
          # SQL proxy — see packages/db/src/index.ts. If you want more
          # throughput, four is worth measuring now; measure it, do not assume.
          #
          # Parallelism already comes from the eight per-persona jobs above:
          # 8 jobs x 2 workers = 16 concurrent.
          #
          # …EXCEPT ON THE SHARDS THAT SHARE THE GOD ACCOUNT. `god`, `org-staff`,
          # `camp-lead`, `officer` and `supplier` all reach the console through
          # ONE set of credentials (E2E_GOD_EMAIL — `elevateToGod`,
          # `provisionOrgStaff`, `provisionEngineer`). A second worker there is
          # not parallelism, it is two browsers signing in as the same principal
          # and racing each other's session, and the god bootstrap writes on
          # first load. Measured 29 Jul 2026 on the org-staff shard: 2 workers →
          # 2 failed / 19 passed, a DIFFERENT pair each run (a bio editor torn
          # down mid-step, a concurrent-reviewer test losing its second session);
          # 1 worker → clean, repeatedly. A gate that fails differently every
          # time teaches people to press re-run, which is how a real failure gets
          # waved through.
          #
          # The five persona-isolated shards keep 2.
          E2E_WORKERS: >-
            ${{ (matrix.persona == 'god'
              || matrix.persona == 'org-staff'
              || matrix.persona == 'camp-lead'
              || matrix.persona == 'officer'
              || matrix.persona == 'supplier') && '1' || '2' }}
          # 180s, not the 90s default. The two-user journeys drive a full
          # six-section registration through the UI, and the slowest of them
          # still measure ~2m on a green run — this cap is ~1.5x the slowest
          # real test, not spare room. It survived the proxy fix because these
          # journeys are interaction-bound, not render-bound: making pages 28x
          # faster barely moved them.
          #
          # This once said "the real fix is a factory that seeds a registration
          # instead of clicking through one". That is not a fix available here:
          # @quagga/e2e is defined as "drives the REAL UI — no DB back doors"
          # (its package.json), and it is meant to be runnable against a deployed
          # preview, where there is no database to seed. The cost is the price of
          # the guarantee. 180s is the honest cap for it.
          E2E_TEST_TIMEOUT: "180000"
          # Production build, not `next dev`. Next compiles a route on FIRST
          # REQUEST, and there are 65 pages across the three apps — so a dev-mode
          # run pays a multi-second compile the first time any spec visits any
          # page, several workers block on the same cold compile, and a compile
          # that overruns the 20s navigation cap looks exactly like a product
          # bug. It also tests what actually ships.
          #
          # This was ONCE blamed for the slow runs ("most of why the first run
          # crawled"). It was not: the runs kept crawling on a production build
          # for hours afterwards. See packages/db/src/index.ts for what it was.
          E2E_SERVE: build
          # ONE retry. A genuinely broken test costs `E2E_TEST_TIMEOUT x
          # attempts` per failure, so a second retry triples the cost of a red
          # board to re-prove what the first two attempts already showed. One
          # still absorbs a cold-start flake, and Playwright reports
          # retry-then-pass as flaky, so nothing is hidden by it.
          #
          # This pins the playwright.config.ts default rather than changing it —
          # stated here so a change there is a deliberate choice in both places.
          E2E_RETRIES: "1"
          # DESKTOP GATES. `mobile-360` runs nightly in its own workflow
          # (.github/workflows/mobile.yml) and never on a pull request — it is
          # red by construction until triaged, and a permanently red check
          # teaches people to ignore checks. It still runs locally, where
          # scripts/e2e-local.sh defaults to both projects. Promote a persona
          # into this list, where it WILL block, once its mobile failures reach
          # zero.
          E2E_PROJECTS: desktop-chromium
          BETTER_AUTH_SECRET: ci-only-placeholder-secret-not-a-real-one-0000
          PGCRYPTO_KEY: ci-only-pgcrypto-key-0000000000
        # `tests/` RIDES WITH THE ANON JOB. The matrix runs one persona
        # directory each, and `e2e/tests/` is not a persona — so smoke, the auth
        # round trip and the registry-driven adversarial authz suite had NEVER
        # run in the gate, while the gate was described as covering the whole
        # suite. negative-paths.spec.ts is the file that exists to prove the
        # refusals, and nothing was running it.
        #
        # Attached to `anon` because it is the shortest job and these specs sign
        # up their own actors, so they add ~1 min rather than a whole runner.
        run: |
          if [ "${{ matrix.persona }}" = "anon" ]; then
            ./scripts/e2e-local.sh specs/anon tests
          else
            ./scripts/e2e-local.sh specs/${{ matrix.persona }}
          fi

      # THE SERVER'S OWN ACCOUNT OF THE FAILURE.
      #
      # Without this, a red board gives you the browser's side only: "page.goto
      # timed out". Whether the server threw, or answered slowly, or never
      # answered, is invisible — so a page that takes 20s to render and a page
      # that 500s look identical from here. Diagnosing the 28 Jul timeouts meant
      # rebuilding the whole stack locally to read a log CI already had and threw
      # away. It costs one step and a few hundred KB.
      - name: Collect the app server log
        if: always()
        run: cp "${TMPDIR:-/tmp}/quagga-e2e/dev.log" server.log 2>/dev/null || true

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          # Per persona, or eight uploads collide on one name.
          name: playwright-report-${{ matrix.persona }}
          path: |
            e2e/playwright-report
            e2e/test-results
            server.log
          retention-days: 14
          if-no-files-found: ignore

  # THE ONE REQUIRED CHECK.
  #
  # Branch protection can only require checks BY NAME, so requiring the e2e
  # shards individually means eight entries that have to be re-edited every time
  # a persona is added or renamed — and a shard nobody remembered to mark
  # required is a shard that can go red without blocking a merge. The failure
  # mode is silent, which is the worst kind.
  #
  # So protection requires exactly one: `CI pass`. `ci` and `e2e` must SUCCEED;
  # `commitlint` may also be `skipped`, because it is pull-request-only and does
  # not run on a push to main. Nothing else is tolerated — see the step below.
  #
  # It needs no maintenance when the matrix changes: a new shard is covered the
  # moment it is added, because `needs: [e2e]` is the whole matrix rather than a
  # list of its legs.
  #
  # Same pattern as camp-404 and ops-board.
  #
  # `if: always()` is what makes it work at all. Without it this job would be
  # SKIPPED when an upstream job fails, and a skipped required check does not
  # block a merge — the gate would pass by not running, which is precisely
  # backwards.
  # COVERAGE, AS A RATCHET RATHER THAN A NUMBER ON A BADGE.
  #
  # The floors live in each workspace's `vitest.config.ts`, not here, so they
  # are enforced identically by `pnpm test:coverage` on a laptop and by this
  # job. Ported from RyRy79261/intake-tracker, which runs the same shape.
  #
  # One shard per workspace, so a breach names the workspace in the checks list
  # rather than making somebody open a log to find out which one moved.
  #
  # WHAT AN APP'S PERCENTAGE MEASURES, AND WHAT IT DOES NOT.
  #
  # Vitest measures only what runs inside the vitest process. The persona suite
  # drives real browsers against `next dev` / `next start` in separate
  # processes with no instrumentation, so all 165 e2e tests contribute ZERO to
  # any number here.
  #
  # That is why the three apps scope `coverage.include` to `lib/**` — the
  # server actions, stores and helpers. `app/**` and `components/**` are route
  # components the personas render, and counting them produced a ~3% figure
  # that described the test runner rather than the code. We reported that
  # number once, in July 2026, and threw it away: it invited somebody to "fix"
  # it with unit tests nobody needed, and it hid real drops inside noise.
  #
  # Scoped to `lib/`, the figure answers a question worth asking — how much of
  # the server logic has a test — and it moves for the right reason: a new
  # untested server action drops it. Read every app row as "of its server
  # logic", which is what the matrix label says.
  #
  # Still uncounted, and deliberately so: pages, RSC, and client components.
  # Their gate is the e2e matrix above. To give THOSE a number you would have
  # to collect V8 coverage from the Next server during the e2e run
  # (`NODE_V8_COVERAGE` on the app process, flushed on clean shutdown,
  # source-mapped back through `.next`). That is real work and nobody has
  # decided it is worth it.
  #
  # THIS GATES THE MERGE, since 4 Aug 2026. Before that a breached floor
  # reddened its own shard while `CI pass` — the one required check — stayed
  # green, so every floor in the repo was decoration. The original reason for
  # keeping it out was that a flaky comment-posting action should not block a
  # green branch; that is handled where it belongs, on the comment step itself
  # (`continue-on-error`), rather than by exempting the floors.
  coverage:
    name: coverage · ${{ matrix.workspace }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    strategy:
      # Every workspace reports even when one breaches — a partial picture is
      # less useful than the whole one.
      fail-fast: false
      matrix:
        include:
          - workspace: "@quagga/core"
            label: "@quagga/core"
            directory: packages/core
          - workspace: "@quagga/ui"
            label: "@quagga/ui"
            directory: packages/ui
          - workspace: "@quagga/auth"
            label: "@quagga/auth"
            directory: packages/auth
          - workspace: "@quagga/db"
            label: "@quagga/db"
            directory: packages/db
          - workspace: "@quagga/types"
            label: "@quagga/types"
            directory: packages/types
          # The three apps measure `lib/` only — the label carries that, because
          # the comment is read out of context and "@quagga/web 87%" would
          # otherwise be read as the whole app.
          - workspace: "@quagga/web"
            label: "@quagga/web (lib/ — server logic)"
            directory: apps/web
          - workspace: "@quagga/org"
            label: "@quagga/org (lib/ — server logic)"
            directory: apps/org
          - workspace: "@quagga/suppliers"
            label: "@quagga/suppliers (lib/ — server logic)"
            directory: apps/suppliers
    steps:
      # `fetch-depth: 0` — the scope check below diffs against the base branch,
      # which a shallow clone does not have.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.0

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # ONLY REPORT WHAT THE BRANCH ACTUALLY TOUCHED.
      #
      # Five unchanged coverage tables on every pull request is noise, and noise
      # is how a real drop gets scrolled past. A workspace is in scope when its
      # own directory changed, or when the thing that decides the floors did.
      #
      # Plain `git diff`, not a third-party action: one less thing with write
      # access to pull requests, and the rule stays readable.
      - name: Is this workspace in scope?
        id: scope
        run: |
          base="origin/${{ github.base_ref || 'main' }}"
          git fetch --depth=1 origin "${{ github.base_ref || 'main' }}" >/dev/null 2>&1 || true
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "in-scope=true" >> "$GITHUB_OUTPUT"
            echo "Not a pull request — running."
          elif ! git diff --quiet "$base"...HEAD -- \
                 "${{ matrix.directory }}" .github/workflows/ci.yml; then
            echo "in-scope=true" >> "$GITHUB_OUTPUT"
            echo "${{ matrix.directory }} changed on this branch — running."
          else
            echo "in-scope=false" >> "$GITHUB_OUTPUT"
            echo "${{ matrix.directory }} is untouched on this branch — skipping."
          fi

      - name: Install dependencies
        if: steps.scope.outputs.in-scope == 'true'
        run: pnpm install --no-frozen-lockfile

      # Fails the shard when any floor in that workspace is breached.
      - name: Run coverage against the floors
        if: steps.scope.outputs.in-scope == 'true'
        run: pnpm --filter ${{ matrix.workspace }} test:coverage

      # PINNED TO A COMMIT, NOT A TAG. `@v2` is mutable — whoever owns the
      # action can repoint it at any commit, and this step holds
      # `pull-requests: write` on a public repository. The comment records the
      # human-readable version so dependency automation can still bump it.
      #
      # `always()` so the numbers are visible on the run that breached a floor,
      # which is when they matter most.
      #
      # UPDATED IN PLACE, ON PURPOSE. The action finds its previous comment by
      # name and edits it, so each report keeps ONE anchored position in the
      # conversation rather than jumping to the bottom on every push and
      # interleaving with review threads. Five reports that move every run are
      # five things to find again.
      #
      # Whether a table is current is answered by the table, not by where it
      # sits: the action stamps the run and the commit in its footer — "#154
      # for commit c69b1fb" — so it is a glance rather than an inference from a
      # timestamp.
      #
      # This replaced a delete-then-post step, which did put the newest report
      # at the bottom, but scattered it among the reviews and left a window
      # where a run cancelled between the delete and the post removed a comment
      # without replacing it. This repository cancels superseded runs
      # constantly.
      #
      # FORKS GET THE FLOORS, NOT THE COMMENT.
      #
      # A `pull_request` from a fork runs with a READ-ONLY token, whatever this
      # job asks for — so both comment steps would fail and show a red
      # `coverage` shard on the pull request of somebody contributing for the
      # first time. This repository asks for outside help in CONTRIBUTING.md;
      # greeting that with a failing check nobody can fix is the wrong first
      # impression.
      #
      # The floors above still run and still fail on a real breach, because
      # they need no token. Only the reporting is skipped, and the numbers stay
      # readable in the job summary.

      - name: Report coverage on the pull request
        if: >-
          always() && github.event_name == 'pull_request'
          && github.event.pull_request.head.repo.full_name == github.repository
          && steps.scope.outputs.in-scope == 'true'
        # REPORTING NEVER FAILS THE SHARD. `coverage` is in `CI pass`'s needs
        # list, so this job blocks the merge — and a third-party action having
        # a bad afternoon must not be what stops a branch with green floors.
        # The floors step above is the one allowed to fail here.
        continue-on-error: true
        uses: davelosert/vitest-coverage-report-action@8b157684c6a6b259b97d45e72b44242865c0f6a5 # v2.12.2
        with:
          name: ${{ matrix.label }}
          working-directory: ${{ matrix.directory }}
          file-coverage-mode: changes

  ci-pass:
    name: CI pass
    if: always()
    needs: [commitlint, ci, e2e, coverage]
    runs-on: ubuntu-latest
    steps:
      - name: Check every job passed
        run: |
          echo "commit conventions : ${{ needs.commitlint.result }}"
          echo "lint/typecheck/... : ${{ needs.ci.result }}"
          echo "e2e (all shards)   : ${{ needs.e2e.result }}"
          echo "coverage floors    : ${{ needs.coverage.result }}"
          echo

          # UNCONDITIONAL — these run on every event and must succeed.
          #
          # `needs.e2e.result` covers the WHOLE matrix: with fail-fast disabled
          # every shard runs, and the aggregate is `failure` if any single one
          # failed. That is the property that makes this maintenance-free.
          # `coverage` works the same way, and a shard that skipped itself as
          # out of scope still reports `success`.
          for job in "ci:${{ needs.ci.result }}" "e2e:${{ needs.e2e.result }}" "coverage:${{ needs.coverage.result }}"; do
            name="${job%%:*}"; result="${job#*:}"
            if [ "$result" != "success" ]; then
              echo "::error::$name did not pass (result: $result)"
              exit 1
            fi
          done

          # GATED — `commitlint` only runs on pull requests, so `skipped` is a
          # legitimate outcome on a push to main and must not fail the gate.
          # Anything else (failure, cancelled) must.
          case "${{ needs.commitlint.result }}" in
            success|skipped) ;;
            *)
              echo "::error::commit conventions did not pass (result: ${{ needs.commitlint.result }})"
              exit 1
              ;;
          esac

          echo "All jobs passed."
