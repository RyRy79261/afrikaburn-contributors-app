# Local database stack — the thing that lets this repo actually RUN.
#
#   docker compose -f docker-compose.local.yml up -d
#
# Why three containers for one database: the apps talk to Neon through
# `@neondatabase/serverless`, which uses TWO protocols — SQL-over-HTTP for the
# stateless driver (`createHttpDb`, used by every route handler and server
# component) and WebSocket for the pooled/transactional driver
# (`createPooledDb`, used by seeds and multi-write actions). No single local
# proxy implements both, so we run one of each in front of a plain Postgres.
# `NEON_LOCAL_PROXY=1` points both drivers here (packages/db/src/index.ts).
#
# Until this existed, `NEON_LOCAL_PROXY` configured only the WebSocket side, so
# the stack could not be run against a local database at all — which is a large
# part of why the app had never been executed end to end.
#
# Env for the apps (no cloud account needed):
#   DATABASE_URL=postgres://postgres:postgres@localhost:5432/quagga
#   DATABASE_URL_UNPOOLED=postgres://postgres:postgres@localhost:5432/quagga
#   NEON_LOCAL_PROXY=1

services:
  postgres:
    image: postgres:16-alpine
    container_name: quagga-pg
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: quagga
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d quagga"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - quagga-pgdata:/var/lib/postgresql/data

  # WebSocket endpoint (`/v1`) for the pooled/transactional driver.
  wsproxy:
    image: ghcr.io/neondatabase/wsproxy:latest
    container_name: quagga-wsproxy
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APPEND_PORT: "postgres:5432"
      ALLOW_ADDR_REGEX: ".*"
      LOG_TRAFFIC: "false"
    ports:
      - "5433:80"

  # SQL-over-HTTP endpoint (`/sql`) for the stateless driver. wsproxy 404s here.
  httpproxy:
    image: ghcr.io/timowilhelm/local-neon-http-proxy:main
    container_name: quagga-httpproxy
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PG_CONNECTION_STRING: postgres://postgres:postgres@postgres:5432/quagga
    ports:
      - "4444:4444"

volumes:
  quagga-pgdata:
